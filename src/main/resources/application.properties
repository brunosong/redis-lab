spring.application.name=redis-lab

# 원본 DB. 메모리 DB라 껐다 켜면 처음 상태로 돌아갑니다.
spring.datasource.url=jdbc:h2:mem:lab;DATABASE_TO_LOWER=TRUE
spring.sql.init.mode=always
spring.h2.console.enabled=true

# docker compose up -d 로 띄운 Redis. 6379는 brunosong-redis 가 쓰고 있어서 6390으로 뺐습니다.
spring.data.redis.host=localhost
spring.data.redis.port=6390

server.port=8097

# 연습장 값들. 눈으로 보기 쉽게 실제보다 짧고 크게 잡았습니다.
lab.db-delay-ms=300
lab.ttl-seconds=20
lab.replica-lag-ms=1500
